<title>Buildathon Invite Scan</title><style>
:root{--bg:#fafaf9;--card:#fff;--ink:#1c1917;--mute:#78716c;--line:#e7e5e4;--acc:#0f766e;--accbg:#ccfbf1;--off:#f5f5f4}

.count{font-weight:600;margin-left:auto}

main{padding:8px 16px 60px;max-width:900px;margin:0 auto}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:18px 0 6px}
.row{display:grid;grid-template-columns:22px 34px 1fr auto;gap:8px;align-items:start;padding:7px 8px;border-bottom:1px solid var(--line);background:var(--card);cursor:pointer}
.row.off{background:var(--off);opacity:.5}.row.off .nm{text-decoration:line-through}
.num{color:var(--mute);font-variant-numeric:tabular-nums;font-size:12px;padding-top:1px}
.nm{font-weight:600}.bio{color:var(--mute);font-size:12.5px}.w{color:var(--acc);font-size:12px}
.st{font-size:12px;color:var(--mute);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none}

const kw=/engineer|developer|software|founder|cto|ceo|build|ai\b|ml\b|machine|data|full.?stack|devops|product|design|hack|maker|startup|code|ide\b|research|phd/i;
R.forEach(r=>{r.t=r.ci>0?'A':(r.b&&kw.test(r.b)?'B':'C')});
const skip=new Set();let show={A:1,B:1,C:1};
try{JSON.parse(localStorage.getItem('skip')||'[]').forEach(x=>skip.add(x))}catch(e){}
const T={A:['Showed up before','Checked in to at least one past Makers Lounge event'],B:['Builder bio, has not checked in yet','Bio mentions building, engineering, founding or AI'],C:['RSVP only','RSVP\'d to a past event but no check-in or builder bio']};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){const q=document.getElementById('q').value.toLowerCase();let h='';for(const t of ['A','B','C']){if(!show[t])continue;const rs=R.filter(r=>r.t===t&&(!q||(r.n+' '+r.b).toLowerCase().includes(q)));if(!rs.length)continue;h+=`<h2>${T[t][0]} · ${rs.length}</h2>`;for(const r of rs){const off=skip.has(r.i);h+=`<div class="row${off?' off':''}" data-i="${r.i}"><input type="checkbox" ${off?'':'checked'}><span class="num">#${r.i+1}</span><div><div class="nm">${esc(r.n)}</div>${r.b?`<div class="bio">${esc(r.b)}</div>`:''}${r.w?`<div class="w">${esc(r.w)}</div>`:''}</div><div class="st">${r.ci} check-in${r.ci==1?'':'s'}<br>${r.ap} RSVP${r.ap==1?'':'s'}</div></div>`}}document.getElementById('m').innerHTML=h;document.getElementById('cnt').textContent=(500-skip.size)+' of 500 selected'}
document.getElementById('m').addEventListener('click',e=>{const row=e.target.closest('.row');if(!row)return;const i=+row.dataset.i;skip.has(i)?skip.delete(i):skip.add(i);try{localStorage.setItem('skip',JSON.stringify([...skip]))}catch(e){}draw()});
document.getElementById('q').addEventListener('input',draw);
for(const t of ['A','B','C'])document.getElementById('t'+t).onclick=e=>{show[t]=!show[t];e.target.classList.toggle('on');draw()};
document.getElementById('copy').onclick=async()=>{const s=[...skip].sort((a,b)=>a-b).map(i=>'#'+(i+1)).join(', ')||'none';const txt='Skip: '+s;try{await navigator.clipboard.writeText(txt);toast('Copied. Paste it in chat.')}catch(e){prompt('Copy this and paste it in chat:',txt)}};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
draw();
